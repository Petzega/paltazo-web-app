<button aria-label="Alternar visibilidad de contraseña" class="absolute right-2.5 w-8 h-8 flex items-center justify-center rounded-full text-text-secondary hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">

              visibility

<svg class="w-5 h-5" viewbox="0 0 24 24">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>

</button>

      ¿No tienes cuenta? <span class="font-label-lg text-label-lg text-secondary font-semibold ml-1">Regístrate</span>
</button>
</div>
<div class="mt-space-lg mb-space-sm bg-secondary-container/30 rounded-xl p-space-md flex items-center gap-space-sm">

<span class="material-symbols-outlined text-[18px]">verified_user</span>
</div>

      Tus datos se guardan de forma segura y funcionan sin conexión (offline).
    </p>
</div>
</div>
<script>
  let currentMode = 'login';

  function setMode(mode) {
    currentMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const btnText = document.getElementById('btn-primary-text');
    const linkToggle = document.getElementById('link-toggle');
    const linkForgot = document.getElementById('link-forgot');

    if (mode === 'login') {
      tabLogin.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all duration-200 bg-secondary text-on-secondary shadow-sm';
      tabRegister.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-center text-text-secondary hover:text-on-surface transition-all duration-200';
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      btnText.textContent = 'Ingresar';
      linkForgot.classList.remove('hidden');
      linkToggle.innerHTML = '¿No tienes cuenta? <span class="font-label-lg text-label-lg text-secondary font-semibold ml-1">Regístrate</span>';
    } else {
      tabRegister.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all duration-200 bg-secondary text-on-secondary shadow-sm';
      tabLogin.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg text-center text-text-secondary hover:text-on-surface transition-all duration-200';
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      btnText.textContent = 'Crear cuenta';
      linkForgot.classList.add('hidden');
      linkToggle.innerHTML = '¿Ya tienes cuenta? <span class="font-label-lg text-label-lg text-secondary font-semibold ml-1">Inicia sesión</span>';
    }
  }

  function toggleMode() {
    setMode(currentMode === 'login' ? 'register' : 'login');
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('input-password');
    const icon = document.getElementById('pwd-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleAuthSubmit() {
    const email = document.getElementById('input-email').value;
    const action = currentMode === 'login' ? 'Iniciando sesión' : 'Registrando cuenta';
    const btn = document.getElementById('btn-primary');
    const originalContent = btn.innerHTML;
    
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>';
    btn.disabled = true;

    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.disabled = false;
      alert(`${action} con éxito: ${email}`);
    }, 700);
  }
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="max-w-xl mx-auto flex justify-around items-center h-16 px-gutter"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] transition-colors text-primary font-bold" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[24px]">dashboard</span><span class="font-label-sm text-label-sm mt-space-xs">Inicio</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-text-secondary hover:text-on-surface transition-colors" data-path="expenses" href="#"><span class="material-symbols-outlined text-[24px]">receipt_long</span><span class="font-label-sm text-label-sm mt-space-xs">Gastos</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-text-secondary hover:text-on-surface transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[24px]">settings</span><span class="font-label-sm text-label-sm mt-space-xs">Ajustes</span></a></div></nav></body></html>
